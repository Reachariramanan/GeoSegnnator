version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: geosegmenter-backend
    ports:
      - "8090:8080"
    volumes:
      - ./backend/data:/app/data
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - geosegmenter-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: geosegmenter-frontend
    ports:
      - "5175:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8090
    networks:
      - geosegmenter-net

networks:
  geosegmenter-net:
    driver: bridge
